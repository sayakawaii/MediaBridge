name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check mediabridge tests
          ruff format --check mediabridge tests

      - name: Test
        run: pytest -q

      # The example config is the first thing a new user copies; a broken one
      # is a guaranteed bad first impression.
      - name: Validate the example config
        run: mediabridge -c config.example.yaml check-config
